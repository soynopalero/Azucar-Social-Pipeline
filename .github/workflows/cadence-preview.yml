name: Cadence preview (dry-run)

# Manual only. Reads the Monday board and writes docs/cadence_preview.md showing
# what the social cadence WOULD schedule. Posts nothing, touches no queue.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build cadence preview
        env:
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
        run: python code/cadence_engine.py --write

      - name: Commit preview
        run: |
          if git diff --quiet docs/cadence_preview.md 2>/dev/null; then
            echo "Preview unchanged — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/cadence_preview.md
            git commit -m "Update cadence preview [skip ci]"
            git push
          fi
