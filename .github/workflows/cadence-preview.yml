name: Cadence preview (dry-run)

# Manual only. Reads the Monday board and writes docs/cadence_preview.md showing
# what the social cadence WOULD schedule. Posts nothing, touches no queue.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build cadence preview
        env:
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
        run: python code/cadence_engine.py --write

      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cadence_preview.md
          # Use --cached so a brand-new (untracked) preview file is detected too.
          if git diff --cached --quiet; then
            echo "Preview unchanged — nothing to commit."
          else
            git commit -m "Update cadence preview [skip ci]"
            # The engine workflows also rewrite this generated file — retry with
            # rebase on a raced push, keeping the freshest generated version.
            ok=""
            for i in 1 2 3 4; do
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push raced, retry $i"; sleep $((i * 4))
            done
            [ -n "$ok" ] || exit 1
          fi
