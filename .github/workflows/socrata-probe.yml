name: Socrata probe (temporary diagnostic)

# Throwaway, round 2. Round 1 settled that data.wa.gov's "Business Lookup"
# (4wur-kfnr) is an assetType 'href' — a catalog link to DOR's own lookup app,
# holding no rows at all — so the SODA approach cannot work against it. What it
# failed to answer was whether a genuinely tabular business dataset exists at
# another ID: the catalog responses came back HTTP 200 but were read with a
# 4000-byte cap, which truncated the JSON mid-string.
#
# This round reads full bodies and also probes the two non-Socrata fallbacks
# (Secretary of State bulk extract, Liquor and Cannabis Board licensee lists),
# since the session writing this cannot reach any of those hosts. One run should
# be enough to choose a source; then this file gets deleted.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe candidate business-data sources
        run: |
          python - <<'PY'
          import json, re, urllib.error, urllib.parse, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (compatible; azucar-social-pipeline/1.0)"}

          def get(url, note=""):
              print(f"\n=== {note or url}\n--- {url}")
              try:
                  with urllib.request.urlopen(
                          urllib.request.Request(url, headers=UA), timeout=90) as r:
                      body = r.read().decode("utf-8", "replace")  # full read, not capped
                      print(f"HTTP {r.status} {r.headers.get('Content-Type')} "
                            f"({len(body)} bytes)")
                      return body
              except urllib.error.HTTPError as e:
                  print(f"HTTP {e.code} — {e.read().decode('utf-8','replace')[:300]}")
              except Exception as e:
                  print(f"{type(e).__name__}: {e}")
              return None

          def catalog(q, only=None, limit=60):
              params = {"domains": "data.wa.gov", "search_context": "data.wa.gov",
                        "q": q, "limit": limit}
              if only:
                  params["only"] = only
              body = get("https://api.us.socrata.com/api/catalog/v1?"
                         + urllib.parse.urlencode(params),
                         f"catalog: q={q!r} only={only!r}")
              if not body:
                  return
              try:
                  results = json.loads(body).get("results", [])
              except json.JSONDecodeError as e:
                  print(f"  unparseable: {e}")
                  return
              print(f"  {len(results)} results")
              for r in results:
                  res = r.get("resource", {})
                  # 'dataset' is the tabular type — the only one with queryable rows.
                  # str() first: a result missing 'type' would otherwise crash the
                  # format spec and take the whole probe down with it.
                  print(f"  [{str(res.get('type')):<12}] {res.get('id')}  {res.get('name')}")

          # --- 1. Is there a tabular business dataset anywhere on data.wa.gov?
          for q in ("business license", "business licensing service",
                    "business lookup", "UBI unified business identifier",
                    "corporations", "registered business"):
              catalog(q, only="dataset")
          catalog("business", only="dataset")

          # --- 2. Fallbacks the session cannot reach. Print any bulk-download links.
          FILE_LINK = re.compile(
              r'href=["\']([^"\']+\.(?:csv|txt|zip|xlsx|xls))["\']', re.I)

          for url, note in (
                  ("https://www.sos.wa.gov/corps/alldata.aspx",
                   "WA Secretary of State — bulk corporations extract"),
                  ("https://lcb.wa.gov/taxreporting/licensee-list",
                   "WA Liquor and Cannabis Board — licensee list"),
                  ("https://dor.wa.gov/manage-business/city-endorsements/pasco",
                   "DOR — Pasco city endorsement page"),
          ):
              html = get(url, note)
              if html:
                  links = sorted(set(FILE_LINK.findall(html)))
                  print(f"  {len(links)} downloadable file link(s):")
                  for href in links[:25]:
                      print(f"    {href}")
          PY
