name: Socrata probe (temporary diagnostic)

# Throwaway. data.wa.gov refused the Pasco license pull with "no row or column
# access to non-tabular tables", which means dataset 4wur-kfnr does not hold
# queryable rows at all. The session that writes this code cannot reach
# data.wa.gov, so this job is the only way to see what the portal actually
# serves. It answers three questions in one run — what kind of asset 4wur-kfnr
# is, whether any endpoint yields its rows, and whether a genuinely tabular
# business-license dataset exists on the portal — then gets deleted.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe data.wa.gov
        run: |
          python - <<'PY'
          import json, urllib.error, urllib.parse, urllib.request

          UA = {"User-Agent": "azucar-social-pipeline/1.0", "Accept": "application/json"}

          def get(url, note=""):
              print(f"\n=== {note or url}\n--- {url}")
              try:
                  with urllib.request.urlopen(
                          urllib.request.Request(url, headers=UA), timeout=60) as r:
                      body = r.read(4000).decode("utf-8", "replace")
                      print(f"HTTP {r.status} {r.headers.get('Content-Type')}")
                      return body
              except urllib.error.HTTPError as e:
                  print(f"HTTP {e.code} — {e.read().decode('utf-8','replace')[:400]}")
              except Exception as e:
                  print(f"{type(e).__name__}: {e}")
              return None

          DS = "4wur-kfnr"

          # 1. What kind of asset is it? A non-tabular asset names what it really
          #    is here — and, if it is a link out, where it points.
          meta = get(f"https://data.wa.gov/api/views/{DS}.json", "metadata for 4wur-kfnr")
          if meta:
              try:
                  m = json.loads(meta)
                  for k in ("id", "name", "assetType", "displayType", "viewType",
                            "newBackend", "blobId", "blobFilename", "href",
                            "externalLink", "attributionLink", "provenance"):
                      if k in m:
                          print(f"  {k} = {m[k]!r}")
                  for k, v in ((m.get("metadata") or {}).get("custom_fields") or {}).items():
                      print(f"  custom_fields[{k}] = {v!r}")
                  print(f"  columns = {len(m.get('columns') or [])}")
                  print(f"  childViews = {m.get('childViews')}")
              except json.JSONDecodeError as e:
                  print(f"  unparseable: {e}")

          # 2. Does ANY endpoint yield rows for it? The SODA query already failed;
          #    the CSV export is a different code path and sometimes still works.
          get(f"https://data.wa.gov/api/views/{DS}/rows.csv?accessType=DOWNLOAD&limit=3",
              "bulk CSV export")
          get(f"https://data.wa.gov/resource/{DS}.csv?$limit=3", "SODA csv")

          # 3. Is there a genuinely tabular business-license dataset on the portal?
          #    The Discovery API searches the whole catalog and reports each asset's
          #    real type, which is exactly what we could not see from the outside.
          q = urllib.parse.urlencode({
              "domains": "data.wa.gov", "search_context": "data.wa.gov",
              "q": "business license", "limit": 40})
          cat = get(f"https://api.us.socrata.com/api/catalog/v1?{q}",
                    "catalog search: 'business license'")
          if cat:
              try:
                  for r in json.loads(cat).get("results", []):
                      res = r.get("resource", {})
                      print(f"  [{res.get('type')}] {res.get('id')}  {res.get('name')}")
              except json.JSONDecodeError as e:
                  print(f"  unparseable: {e}")

          q2 = urllib.parse.urlencode({
              "domains": "data.wa.gov", "search_context": "data.wa.gov",
              "q": "business", "only": "dataset", "limit": 60})
          cat2 = get(f"https://api.us.socrata.com/api/catalog/v1?{q2}",
                     "catalog search: tabular datasets matching 'business'")
          if cat2:
              try:
                  for r in json.loads(cat2).get("results", []):
                      res = r.get("resource", {})
                      print(f"  [{res.get('type')}] {res.get('id')}  {res.get('name')}")
              except json.JSONDecodeError as e:
                  print(f"  unparseable: {e}")
          PY
