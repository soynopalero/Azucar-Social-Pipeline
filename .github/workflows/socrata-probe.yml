name: Socrata probe (temporary diagnostic)

# Throwaway, round 3 — kept only until the Pasco pull is confirmed working.
#
# Round 1 proved the portal's "Business Lookup" (4wur-kfnr) is an assetType
# 'href' with no rows: a catalog link to DOR's lookup app, not data. Round 2
# found the real thing — hw7n-fcif, "BLS License list (merged)", a genuinely
# tabular dataset of the Business Licensing Service roll.
#
# pasco_licenses.py now points at hw7n-fcif and resolves its column names at
# runtime, so it either works or fails printing the real names. This probe is
# the backstop for the second case: it dumps that dataset's columns, a sample
# row, and how many rows each plausible city column matches for Pasco — enough
# to fix the field mapping without another merge cycle. Delete once green.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect the BLS License list dataset
        run: |
          python - <<'PY'
          import json, urllib.error, urllib.parse, urllib.request

          DS = "hw7n-fcif"
          UA = {"User-Agent": "azucar-social-pipeline/1.0", "Accept": "application/json"}

          def get(url, note=""):
              print(f"\n=== {note or url}\n--- {url}")
              try:
                  with urllib.request.urlopen(
                          urllib.request.Request(url, headers=UA), timeout=90) as r:
                      body = r.read().decode("utf-8", "replace")
                      print(f"HTTP {r.status} ({len(body)} bytes)")
                      return body
              except urllib.error.HTTPError as e:
                  print(f"HTTP {e.code} — {e.read().decode('utf-8','replace')[:300]}")
              except Exception as e:
                  print(f"{type(e).__name__}: {e}")
              return None

          # 1. Confirm it is tabular, and get the authoritative column names.
          meta = get(f"https://data.wa.gov/api/views/{DS}.json", "metadata")
          columns = []
          if meta:
              try:
                  m = json.loads(meta)
                  print(f"  name = {m.get('name')!r}")
                  for k in ("assetType", "displayType", "viewType", "rowsUpdatedAt"):
                      print(f"  {k} = {m.get(k)!r}")
                  columns = [c["fieldName"] for c in (m.get("columns") or [])
                             if c.get("fieldName")]
                  print(f"  {len(columns)} columns:")
                  for c in (m.get("columns") or []):
                      print(f"    {c.get('fieldName')}  ({c.get('dataTypeName')})"
                            f"  — {c.get('name')}")
              except json.JSONDecodeError as e:
                  print(f"  unparseable: {e}")

          # 2. One real row, so the actual value shapes are visible (how city is
          #    spelled, whether status is a word or a code, how dates are formatted).
          row = get(f"https://data.wa.gov/resource/{DS}.json?$limit=1", "sample row")
          if row:
              try:
                  for r in json.loads(row):
                      for k, v in sorted(r.items()):
                          print(f"    {k} = {v!r}")
              except json.JSONDecodeError as e:
                  print(f"  unparseable: {e}")

          # 3. Which column actually selects Pasco, and how many rows it yields.
          #    Counting every candidate at once means the right filter is known
          #    outright rather than guessed at one merge cycle per attempt.
          candidates = [c for c in columns if "city" in c.lower()] or ["city"]
          print(f"\n=== Pasco row counts by candidate city column: {candidates}")
          for col in candidates:
              where = urllib.parse.quote(f"upper({col})='PASCO'")
              body = get(f"https://data.wa.gov/resource/{DS}.json"
                         f"?$select=count(1)&$where={where}", f"count where {col}=PASCO")
              if body:
                  print(f"  -> {body.strip()[:200]}")
          PY
