name: FB Event Kit refresh

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min, same cadence as the website sync
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: fb-kit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow

      - name: Build FB kit
        env:
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
        run: python code/build_fb_kit.py

      - name: Commit if the kit changed
        run: |
          git config user.name "fb-kit-bot"
          git config user.email "actions@github.com"
          git add docs/fb_kit.json docs/media/fb-kit/
          # Ignore the generated_at timestamp so we only commit real changes
          if git diff --cached --quiet -I '"generated_at"'; then
            echo "Kit unchanged — nothing to commit."
          else
            git commit -m "FB kit refresh [skip ci]"
            # Concurrent workflows (eventbrite-auto + engine both push at
            # publish time) race on main — retry instead of dying.
            ok=""
            for i in 1 2 3 4; do
              # -X theirs: on conflict keep this run's freshly generated files —
              # everything committed here is generated output, newest wins.
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push raced, retry $i"; sleep $((i * 4))
            done
            [ -n "$ok" ] || exit 1
          fi

      - name: Telegram alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          for chat in 5056319378 8734741621; do
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage"               -d chat_id=$chat               --data-urlencode "text=⚠️ ${{ github.workflow }} hit an error — captions or posts may be delayed. Pedro can check the log here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
          done
