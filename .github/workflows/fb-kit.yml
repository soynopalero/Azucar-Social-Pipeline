name: FB Event Kit refresh

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min, same cadence as the website sync
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: fb-kit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow

      - name: Build FB kit
        id: build
        env:
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
        run: python code/build_fb_kit.py

      - name: Commit if the kit changed
        id: commit
        run: |
          git config user.name "fb-kit-bot"
          git config user.email "actions@github.com"
          git add docs/fb_kit.json docs/media/fb-kit/
          # Ignore the generated_at timestamp so we only commit real changes
          if git diff --cached --quiet -I '"generated_at"'; then
            echo "Kit unchanged — nothing to commit."
          else
            git commit -m "FB kit refresh [skip ci]"
            # Concurrent workflows (eventbrite-auto + engine both push at
            # publish time) race on main — retry instead of dying.
            ok=""
            for i in 1 2 3 4; do
              # -X theirs: on conflict keep this run's freshly generated files —
              # everything committed here is generated output, newest wins.
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push raced, retry $i"; sleep $((i * 4))
            done
            [ -n "$ok" ] || exit 1
          fi

      # This runs 48x a day; one blip must not page anyone twice. The kit is a
      # copy-paste helper, so a stale kit costs a few minutes, not a post.
      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/ops-alert
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          text: |
            ${{ steps.build.outcome == 'failure' && 'ℹ️ FB Event Kit refresh failed (Monday API error after retries). The kit page may be a bit stale; it retries in 30 min. Captions and posts are unaffected.' || 'ℹ️ FB Event Kit refresh could not push its update. It retries in 30 min; captions and posts are unaffected.' }}
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
