name: Pasco business licenses

# Schedule intentionally disabled: no working data source yet (see the header of
# code/pasco_licenses.py for what has been ruled out). Left armed it would fail
# on the 1st of every month and fire the Telegram alert below for a problem
# nobody can act on. Restore the cron line once a manual run succeeds:
#   schedule:
#     - cron: "0 13 1 * *"   # 1st of the month, 6 AM Pacific
on:
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: pasco-licenses
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install — the script is stdlib only.
      - name: Pull the Pasco slice of DOR's Business Lookup
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python code/pasco_licenses.py

      - name: Commit if the license roll changed
        run: |
          git config user.name "pasco-licenses-bot"
          git config user.email "actions@github.com"
          git add docs/pasco_licenses.csv docs/pasco_licenses_changes.json
          if git diff --cached --quiet -- docs/pasco_licenses.csv; then
            echo "No license changes this month — nothing to commit."
            git reset >/dev/null
          else
            git commit -m "Pasco business licenses refresh [skip ci]"
            # Same race as the other writers: several workflows push to main.
            ok=""
            for i in 1 2 3 4; do
              # -X theirs: everything here is generated output, newest wins.
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push raced, retry $i"; sleep $((i * 4))
            done
            [ -n "$ok" ] || exit 1
          fi

      - name: Telegram alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          for chat in 5056319378 8734741621; do
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" -d chat_id=$chat --data-urlencode "text=⚠️ ${{ github.workflow }} hit an error — the Pasco business-license snapshot did not refresh. Pedro can check the log here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
          done
