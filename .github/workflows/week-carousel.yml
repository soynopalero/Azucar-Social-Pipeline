name: Weekly round-up carousel

# Queue the Monday "Esta semana en Azúcar" post: one carousel carrying the
# whole week's flyers.
#
# This is the post that lets the every-week nights drop to zero campaigns of
# their own. Karaoke was taking 18 posts for one night and the heels class 32;
# people do not learn that karaoke is Wednesday from the eleventh flyer. One
# round-up covers them all, and the budget that frees is where the big shows
# get their posts from.
#
# Runs a couple of hours before the post is due, so a failure is visible and
# fixable while the slot is still ahead rather than behind.

# NO SCHEDULE ON PURPOSE. Queueing the round-up is what approving it in
# Telegram does — see week-card.yml, which reviews it on Friday and queues it
# for Monday 11:00 once Pedro taps Approve. A cron here would post the week
# whether or not he ever tapped, which is the thing the gate exists to stop.
# This workflow stays dispatch-only as the manual escape hatch.
on:
  workflow_dispatch:
    inputs:
      week_of:
        description: "Any date inside the target week (YYYY-MM-DD). Blank = this week."
        required: false
        type: string
      dry_run:
        description: "Print the carousel without queueing it"
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # the flyers are committed to docs/ so Pages can serve them

concurrency:
  # Shared with week-card.yml and canva-check.yml on purpose. Two of these
  # running at once would each spend the other's Canva refresh token — they
  # are single-use, and re-using one revokes the whole flow — and they write
  # the same queue. One name serialises both hazards.
  group: week-roundup
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # pynacl encrypts the rotated Canva token for the secret write-back.
        run: pip install requests pynacl

      - name: Check the logic before touching the queue
        run: |
          python code/build_week_carousel.py --selftest
          python code/canva_api.py --selftest
          python code/gh_secret.py --selftest
          python code/cap_queue.py --selftest

      - name: Build the round-up
        id: build
        env:
          PYTHONUNBUFFERED: "1"
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
          # Slide one is the Canva week card. Missing credentials only cost
          # that slide — the carousel still queues the flyers.
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Through the environment, never interpolated into the script: a
          # dispatch input expanded inline is a shell injection with the
          # repo's secrets in reach.
          WEEK_OF: ${{ inputs.week_of }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$WEEK_OF" ]; then args+=(--week-of "$WEEK_OF"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python code/build_week_carousel.py ${args[@]+"${args[@]}"}

      - name: Commit the queue and the slide images
        if: ${{ !inputs.dry_run }}
        run: |
          git add -A posts_queue.json docs/posts_queue.json docs/media/cadence 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit — no carousel queued this week."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Weekly round-up carousel [skip ci]"
            # The queue is merged by entry id if another workflow committed
            # meanwhile — see .gitattributes and code/merge_queue.py.
            git config merge.queue.driver "python code/merge_queue.py %O %A %B"
            ok=""
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push raced, retry $i"; sleep $((i * 4))
            done
            [ -n "$ok" ] || exit 1
          fi

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/ops-alert
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          text: |
            ⚠️ A manual round-up carousel run failed — nothing was queued. The normal path is the Friday review in week-card.yml; this is the hand-run escape hatch.
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
