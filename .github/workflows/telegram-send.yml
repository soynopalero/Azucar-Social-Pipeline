name: Telegram send (manual)

# Send a one-off message from @AzucarEventsBot to one or more chats.
# Used when someone can only be reached through this bot (e.g. they haven't opened @AzucarShowBot yet).
# Run: gh workflow run telegram-send.yml -f chat_ids="8734741621" -f text="..."
# Unlike the ops-alert action, this FAILS loudly if Telegram rejects the send and prints why.

on:
  workflow_dispatch:
    inputs:
      chat_ids:
        description: "Space-separated Telegram chat ids (Pedro 5056319378, Jayme 8734741621)"
        required: true
      text:
        description: "Plain-text message"
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send and report
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEXT: ${{ inputs.text }}
          CHATS: ${{ inputs.chat_ids }}
        run: |
          test -n "$TOKEN" || { echo "::error::TELEGRAM_BOT_TOKEN not set"; exit 1; }
          me=$(curl -s "https://api.telegram.org/bot${TOKEN}/getMe")
          echo "bot: $(echo "$me" | sed 's/.*"username":"\([^"]*\)".*/\1/')"
          fail=0
          for chat in $CHATS; do
            resp=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="$chat" -d disable_web_page_preview=true \
              --data-urlencode "text=$TEXT")
            if echo "$resp" | grep -q '"ok":true'; then
              echo "DELIVERED to $chat"
            else
              echo "::error::NOT delivered to $chat: $resp"
              fail=1
            fi
          done
          exit $fail
