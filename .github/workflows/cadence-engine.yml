name: Cadence engine (live)

# Daily pass: drafts captions for new eligible events (-> Telegram approval),
# and queues the full posting schedule for events whose captions were approved.
# Nothing is posted without a human tapping Approve in Telegram.
on:
  schedule:
    - cron: "0 16 * * *"   # daily, ~9am Pacific
  workflow_dispatch:

# Share the post-scheduler's group so the two workflows never commit
# posts_queue.json at the same time.
concurrency:
  group: post-scheduler
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run cadence engine (live enqueue + preview)
        env:
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python code/cadence_engine.py --enqueue --write

      - name: Commit queue + preview
        if: always()   # commit whatever the engine produced, even when it exits red
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts_queue.json docs/posts_queue.json docs/cadence_preview.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Cadence engine run [skip ci]"
            git pull --rebase origin main
            git push
          fi
