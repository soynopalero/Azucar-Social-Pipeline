name: Cadence engine (live)

# Daily pass: drafts captions for new eligible events (-> Telegram approval),
# and queues the full posting schedule for events whose captions were approved.
# Nothing is posted without a human tapping Approve in Telegram.
on:
  schedule:
    - cron: "0 16 * * *"   # daily, ~9am Pacific
  workflow_dispatch:

# Share the post-scheduler's group so the two workflows never commit
# posts_queue.json at the same time.
concurrency:
  group: post-scheduler
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run cadence engine (live enqueue + preview)
        env:
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python code/cadence_engine.py --enqueue --write

      # Cleanup pass for the shared Azucar Events Google Calendar: deletes the
      # entry when a Monday item goes Cancelled/Postponed, re-dates it when the
      # event's date/time moves. DRY-RUN for now (per project convention) — it
      # only prints what it would change. After reviewing a run log or two,
      # flip it live by adding --live below and removing continue-on-error.
      # Requires the v2 code/gcal_webhook.gs deployment; against v1 the script
      # refuses to send anything.
      - name: GCal cleanup (dry-run)
        continue-on-error: true   # a hiccup here must not block the caption run
        env:
          PYTHONUNBUFFERED: "1"
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
          GCAL_WEBHOOK_URL: ${{ secrets.GCAL_WEBHOOK_URL }}
        run: python code/gcal_sync.py

      - name: Commit queue + preview
        if: always()   # commit whatever the engine produced, even when it exits red
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts_queue.json docs/posts_queue.json docs/cadence_preview.md docs/media/ docs/captions/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Cadence engine run [skip ci]"
            # Concurrent workflows (eventbrite-auto + engine both push at
            # publish time) race on main — retry instead of dying.
            ok=""
            for i in 1 2 3 4; do
              # -X theirs: on conflict keep this run's freshly generated files —
              # everything committed here is generated output, newest wins.
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push raced, retry $i"; sleep $((i * 4))
            done
            [ -n "$ok" ] || exit 1
          fi

      - name: Telegram alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          for chat in 5056319378 8734741621; do
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage"               -d chat_id=$chat               --data-urlencode "text=⚠️ ${{ github.workflow }} hit an error — captions or posts may be delayed. Pedro can check the log here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
          done
