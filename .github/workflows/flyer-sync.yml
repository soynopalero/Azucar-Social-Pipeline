name: Flyer sync

# Dispatched by the Telegram bot's /update flow: shuttles the new flyers from
# Telegram onto the Monday item (too slow for a Cloudflare Worker), then runs
# the cadence engine so fresh curated captions go out for approval right away.

on:
  workflow_dispatch:
    inputs:
      item_id:
        description: "Monday item id"
        required: true
        type: string
      file_ids:
        description: "Telegram file_ids, comma-separated, hero first"
        required: true
        type: string
      chat_id:
        description: "Telegram chat to notify"
        required: false
        type: string
        default: ""

permissions:
  contents: write

# Shares the caption-drafting lock with cadence-engine.yml (both run the
# engine); the post scheduler has its own group — see cadence-engine.yml.
concurrency:
  group: cadence
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Sync flyers from Telegram to Monday
        id: sync
        env:
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # hero-flyer vision pick
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ITEM_ID: ${{ inputs.item_id }}
          TG_FILE_IDS: ${{ inputs.file_ids }}
          NOTIFY_CHAT_ID: ${{ inputs.chat_id }}
        run: python code/flyer_sync.py

      - name: Draft fresh captions (cadence engine)
        id: engine
        env:
          PYTHONUNBUFFERED: "1"
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python code/cadence_engine.py --enqueue --write

      - name: Commit engine output
        id: commit
        if: always() && steps.engine.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Queue files merge by entry id (see .gitattributes + code/merge_queue.py).
          git config merge.queue.driver "python code/merge_queue.py %O %A %B"
          git add posts_queue.json docs/posts_queue.json docs/cadence_preview.md docs/media/ docs/captions/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Flyer sync + cadence run [skip ci]"
            ok=""
            for i in 1 2 3 4; do
              # -X theirs covers the generated preview/caption/media files.
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push raced, retry $i"; sleep $((i * 4))
            done
            [ -n "$ok" ] || exit 1
          fi

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/ops-alert
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          text: |
            ${{ steps.sync.outcome == 'failure' && format('⚠️ Flyer sync: the new flyers for Monday item {0} did NOT reach Monday. The person who sent them will need to /update again once this is fixed.', inputs.item_id) || steps.engine.outcome == 'failure' && format('⚠️ Flyer sync: flyers for Monday item {0} are on Monday, but redrafting captions failed for at least one event (see ERROR lines). The daily cadence run will retry.', inputs.item_id) || steps.commit.outcome == 'failure' && '⚠️ Flyer sync: everything ran but the output could not be pushed to main. Re-run the cadence engine workflow.' || '⚠️ Flyer sync failed before doing anything (checkout/setup).' }}
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
