name: Flyer sync

# Dispatched by the Telegram bot's /update flow: shuttles the new flyers from
# Telegram onto the Monday item (too slow for a Cloudflare Worker), then runs
# the cadence engine so fresh curated captions go out for approval right away.

on:
  workflow_dispatch:
    inputs:
      item_id:
        description: "Monday item id"
        required: true
        type: string
      file_ids:
        description: "Telegram file_ids, comma-separated, hero first"
        required: true
        type: string
      chat_id:
        description: "Telegram chat to notify"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: post-scheduler   # shares the queue-commit lock with the other engines
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Sync flyers from Telegram to Monday
        env:
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ITEM_ID: ${{ inputs.item_id }}
          TG_FILE_IDS: ${{ inputs.file_ids }}
          NOTIFY_CHAT_ID: ${{ inputs.chat_id }}
        run: python code/flyer_sync.py

      - name: Draft fresh captions (cadence engine)
        env:
          PYTHONUNBUFFERED: "1"
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python code/cadence_engine.py --enqueue --write

      - name: Commit engine output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts_queue.json docs/posts_queue.json docs/cadence_preview.md docs/media/ docs/captions/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Flyer sync + cadence run [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Telegram alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          for chat in 5056319378 8734741621; do
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage"               -d chat_id=$chat               --data-urlencode "text=⚠️ ${{ github.workflow }} hit an error — captions or posts may be delayed. Pedro can check the log here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
          done
