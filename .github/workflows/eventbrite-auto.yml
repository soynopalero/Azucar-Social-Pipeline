name: Eventbrite auto-create

# Fired by the Telegram bot the moment an event is published to Monday
# (workflow_dispatch via GITHUB_TRIGGER_TOKEN — same mechanism as the cadence
# engine). Creates Eventbrite pages for every ready item that doesn't have one,
# writes the URL back to Monday, and refreshes the FB Event Kit.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: eventbrite-auto
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow requests

      - name: Git identity (the script pushes the FB kit refresh itself)
        run: |
          git config user.name "eventbrite-bot"
          git config user.email "actions@github.com"

      - name: Wait for Monday file uploads to settle
        run: sleep 20

      - name: Create Eventbrite events for all pending items
        env:
          PYTHONUNBUFFERED: "1"
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
          # Telegram "done" message (Pedro + Jayme). Silently skipped if the
          # TELEGRAM_BOT_TOKEN secret hasn't been added to this repo yet.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NOTIFY_CHAT_IDS: "5056319378,8734741621"
          # Azucar Events Google Calendar (Apps Script webhook) — silent no-op until set
          GCAL_WEBHOOK_URL: ${{ secrets.GCAL_WEBHOOK_URL }}
        run: python code/monday_to_eventbrite.py --all-pending

      - name: Telegram alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          for chat in 5056319378 8734741621; do
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage"               -d chat_id=$chat               --data-urlencode "text=⚠️ ${{ github.workflow }} hit an error — captions or posts may be delayed. Pedro can check the log here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
          done
