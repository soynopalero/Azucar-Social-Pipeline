name: Post-show sales report

# The morning after every show: pull Eventbrite ticket sales + Toast door sales
# and Telegram Pedro + Jayme the summary plus the full report as a file.
#
# Nothing is committed. This repo is PUBLIC, so per-show revenue stays out of it
# (and out of Actions artifacts, which are public too on a public repo) —
# Telegram is the private archive.
#
# Runs daily rather than only on weekends — karaoke is Wednesdays, the 18+ nights
# are Fridays, and shows land on Sundays too. A day with no event exits quietly.

on:
  schedule:
    - cron: "0 18 * * *"  # 11:00 America/Los_Angeles (18:00 UTC during PDT)
  workflow_dispatch:
    inputs:
      date:
        description: "Show date to report, YYYY-MM-DD (blank = the last 36 hours)"
        required: false
        type: string
      dry_run:
        description: "Print only — no Telegram message, no report file sent"
        required: false
        type: boolean
        default: false

permissions:
  contents: read  # nothing is written back — the report goes to Telegram only

concurrency:
  group: sales-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check the money math before trusting the numbers
        run: python code/sales_report.py --selftest

      - name: Build the sales report
        env:
          PYTHONUNBUFFERED: "1"
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NOTIFY_CHAT_IDS: "5056319378,8734741621"
          # Toast is optional: with no credentials the script reads a CSV export
          # from reports/toast/, and says so plainly if there isn't one.
          TOAST_CLIENT_ID: ${{ secrets.TOAST_CLIENT_ID }}
          TOAST_CLIENT_SECRET: ${{ secrets.TOAST_CLIENT_SECRET }}
          TOAST_RESTAURANT_GUID: ${{ secrets.TOAST_RESTAURANT_GUID }}
          TOAST_TICKET_ITEMS: ${{ vars.TOAST_TICKET_ITEMS }}
        run: |
          python code/sales_report.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Telegram alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          for chat in 5056319378 8734741621; do
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id=$chat \
              --data-urlencode "text=⚠️ The sales report failed to run — Saturday's numbers aren't in Telegram. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
          done
